services:
  - type: web
    name: veeb-resolver
    runtime: docker
    # Uploaded baseline. Free sleeps on idle and cannot meet the startup target.
    # Select an always-on compute plan before a production Blueprint sync.
    plan: free
    healthCheckPath: /
    envVars:
      - key: RESOLVER_SECRET
        sync: false
      - key: VEEB_MP3_MAX_CONCURRENT
        value: "3"
      - key: VEEB_MP3_MAX_BACKGROUND
        value: "2"
      - key: VEEB_PLAYBACK_START_SLA_MS
        value: "3000"
      - key: VEEB_MP3_OUTPUT_STALL_TIMEOUT
        value: "20"
